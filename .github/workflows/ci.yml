name: C build and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - debian:13
          - ubuntu:22.04
          - ubuntu:24.04
    container: ${{ matrix.image }}
    steps:
      - name: Install distro toolchain
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git build-essential libcrypt-dev systemd python3
      - uses: actions/checkout@v4
      - name: Build
        run: make -j2
      - name: Validate systemd unit (does not start service)
        run: |
          install -D -m 0755 Genesis/src/merc /opt/anathema/src/merc
          systemd-analyze verify deploy/anathema.service
      - name: Regression tests
        run: make test
      - name: Isolated boot and graceful stop
        run: python3 tests/smoke_shutdown.py
      - name: Address and undefined-behavior sanitizers
        run: make sanitize
